.twtop nav a::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;border-radius:2px;background:linear-gradient(90deg,#ff7a33,#ff4d8d);transform:scaleX(0);transition:transform .25s}

.twtop nav{width:100%;display:flex;gap:16px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:4px}

.twtop{position:fixed;left:0;right:0}#cap{top:calc(2.6vh + 64px)}

    vertexShader: BREATH + `attribute float size; attribute float kind; attribute float act; attribute vec4 color; varying vec4 vC; varying float vK; varying float vA; uniform float uScale;
      void main(){ if (act < -0.5){ gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; return; }
        vec4 mv = modelViewMatrix*vec4(breath(position),1.0); gl_Position = projectionMatrix*mv;
        gl_PointSize = size*(1.0 + 2.2*act)*uScale/max(1.0,-mv.z); vC = color; vK = kind; vA = act; }`,
    fragmentShader:`varying vec4 vC; varying float vK; varying float vA;
      void main(){ float d = length(gl_PointCoord-0.5)*2.0; if (d > 1.0) discard;
        if (vK > 1.5){ gl_FragColor = vec4(vC.rgb, vC.a*smoothstep(0.14,0.0,abs(d-0.86))); return; }
        float body = smoothstep(1.0, 0.7, d), core = smoothstep(0.42, 0.0, d)*vA;
        vec3 c = mix(vC.rgb, vec3(1.0), core*0.55);
        float a = vC.a*body*(1.0 - vA) + vA*(0.3*(1.0 - d) + core);
        gl_FragColor = vec4(c, clamp(a, 0.0, 1.0)); }`});
  const pts = new THREE.Points(g, mat); pts.frustumCulled = false; scene.add(pts);
  return {mat, act, actAttr, dyn, IT, HB, SP, g}; })();


const tip = document.getElementById('tip'), ray = new THREE.Raycaster(), v2 = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e=>{ downAt = [e.clientX, e.clientY];
  if (!STILL && !INFRAME && !document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); });
renderer.domElement.addEventListener('pointerup', e=>{ if (!downAt || Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1]) > 6) return;
  let best = -1, bd = 22; D.hubs.forEach((n,i)=>{ if (!n.label) return; const p = H[i].clone().project(cam); if (p.z > 1) return;
    const x = (p.x+1)/2*innerWidth, y = (1-p.y)/2*innerHeight, d = Math.hypot(x-e.clientX, y-e.clientY); if (d < bd){ bd = d; best = i; } });
  if (best < 0){ tip.style.display = 'none'; return; }
  tip.textContent = D.hubs[best].label; tip.style.left = (e.clientX+12)+'px'; tip.style.top = (e.clientY-10)+'px'; tip.style.display = 'block'; });

function fit(){ renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
  PT.mat.uniforms.uScale.value = 900*pr*(innerHeight/900);
  for (const o of GL.groups) o.core.resolution.set(innerWidth, innerHeight); }


let MODE = STILL || /replay/.test(location.search) ? 'replay' : 'live';
const nowS = () => performance.now()/1000;
const LV = {ok: false, at: 0, ev: 0};


const clockEl = document.getElementById('clock'), clk = document.getElementById('ct'), dot = document.getElementById('dot'), bar = document.querySelector('#clock b');
const modeBtn = document.getElementById('mode');
const pad = n => String(n).padStart(2,'0');
function clock(t){
  clockEl.classList.toggle('live', MODE === 'live'); modeBtn.style.display = STILL ? 'none' : '';
  modeBtn.textContent = MODE === 'live' ? (KO ? '24h 재생' : '24h replay') : 'LIVE';
  if (MODE === 'live'){ const d = new Date(), hms = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    dot.classList.toggle('on', LV.ok);
    clk.textContent = LV.ok ? (KO ? `${hms} · LIVE · 실시간 신경망 활성 중` : `LIVE · Real-time neural activity · ${hms}`)
                            : (KO ? `${hms} · LIVE 신호 연결 중…` : `LIVE · connecting… · ${hms}`);
    return; }
  if (!EV.length){ clk.textContent = KO ? '최근 24시간 활동 기록 없음' : 'No activity in the last 24 hours'; return; }
  t = STILL ? Math.min(t, LOOP - 1e-3) : t;
  const ms = realMs(((t % LOOP) + LOOP) % LOOP), d = new Date(ms), hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  clk.textContent = KO ? `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${hm} 실제 활동 재생` : `Replaying real activity · ${hm}`;
  bar.style.width = ((((t % LOOP) + LOOP) % LOOP)/LOOP*100).toFixed(1) + '%'; }
modeBtn.addEventListener('click', e=>{ e.stopPropagation(); MODE = MODE === 'live' ? 'replay' : 'live';
  for (const L of GL.lines) L.last = -1; PT.act.fill(0); PT.actAttr.needsUpdate = true; });
modeBtn.addEventListener('pointerdown', e=>e.stopPropagation());


const trim = l => { if (l.length > 12){ const t = nowS() - 10; for (let i = l.length - 1; i >= 0; i--) if (l[i][0] < t) l.splice(i, 1); } };
const lput = (l, t, a, dir) => { if (a >= MIN_A){ l.push([t, a, dir||0]); trim(l); } };
function liveHub(h, t, a, spread){ const P = PT.HB[h]; if (!P) return; lput(P.lf, t, a); P.real = Date.now(); if (!spread || a < 0.2) return;
  for (const j of ccBy.get(h) || []){ const e = D.cc[j], o = e[0] === h ? e[1] : e[0], a2 = a*(0.3 + 0.45*CCR[j]), L = GL.LI_CC[j];
    lput(L.lf, t, a2, e[0] === h ? 0 : 1); L.real = Date.now(); liveHub(o, t + HOP, a2*0.8, false); } }
function liveItem(k, t){ const P = PT.IT[k]; if (!P) return; lput(P.lf, t, 1); P.real = Date.now();
  for (const j of icBy.get(k) || []){ const e = D.ic[j], a = 0.45 + 0.55*e[2], L = GL.LI_IC[j];
    lput(L.lf, t, a, 0); L.real = Date.now(); liveHub(e[1], t + HOP, a*0.85, true); } }


let spawnAt = 0;
const SPV = new THREE.Vector3();
function spawn(hs, t){ const s = spawnAt++ % SPAWN, P = PT.SP[s], pos = PT.g.attributes.position, col = PT.g.attributes.color;
  SPV.set(0,0,0); hs.forEach(h=>SPV.add(H[h])); SPV.multiplyScalar(1/hs.length);
  SPV.add(new THREE.Vector3(Math.random()-.5, Math.random()-.5, Math.random()-.5).multiplyScalar(80));
  const c = COL[D.hubs[hs[0]].g]; pos.setXYZ(P.p, SPV.x, SPV.y, SPV.z); pos.needsUpdate = true;
  col.setXYZW(P.p, c[0]/255, c[1]/255, c[2]/255, 0.35); col.needsUpdate = true;
  Object.assign(P, {off: false, born: t, lf: [[t, 1, 0]], real: Date.now()});
  const arr = GL.so.posBuf.array;
  for (let m = 0; m < SPAWN_L; m++){ const L = GL.spawnLines[s*SPAWN_L + m], h = hs[m];
    if (h == null){ Object.assign(L, {off: true, lf: [], last: -1}); continue; }
    const tmp = []; curve(SPV, H[h], 0.08, SPAWN_NS, tmp); arr.set(tmp, L.v0*3);
    Object.assign(L, {off: false, c: c.map(x=>x/255), grow: t, lf: [[t + GROWT, 0.8, 0]], real: Date.now(), last: -1});
    liveHub(h, t + GROWT + HOP, 0.7, true); }
  GL.so.posBuf.needsUpdate = true; }
function onEvent(e){ const t = nowS(); LV.ev++; LV.ok = true; LV.at = Date.now();
  if (e.k === 'th'){ (e.it || []).forEach(k=>liveItem(k, t)); (e.h || []).forEach(h=>liveHub(h, t, 1, true)); return; }
  let n = 0;
  (e.it || []).forEach(k=>liveItem(k, t + 0.5*n++)); (e.nh || []).forEach(hs=>{ if (hs.length) spawn(hs, t + 0.5*n++); }); }


async function liveBase(){ for (const u of ['brain_live.json', '/v/brain_live.json']){
    try { const r = await fetch(u + '?t=' + Date.now(), {cache: 'no-store'}); if (r.ok){ const j = await r.json(); if (j.url) return j.url; } } catch (_){ } }
  return 'http:' + '//127.0.0.1:8786'; }
async function connect(){ if (STILL) return; const base = await liveBase();
  let es = null, seq = 0, polling = false, fails = 0;
  const poll = async ()=>{ if (polling) return; polling = true;
    for (;;){ try { const r = await fetch(`${base}/recent?after=${seq}`, {cache: 'no-store'}), j = await r.json();
        if (seq) j.ev.forEach(onEvent); if (j.ev.length) seq = j.ev[j.ev.length-1].s; else if (!seq) seq = 1;
        LV.ok = true; LV.at = Date.now(); fails = 0; } catch (_){ LV.ok = ++fails < 3 && LV.ok; }
      await new Promise(r=>setTimeout(r, 2000)); } };
  const hello = setTimeout(()=>{ if (!LV.ok){ es && es.close(); poll(); } }, 8000);
  try { es = new EventSource(`${base}/events`);
    es.addEventListener('hello', ()=>{ LV.ok = true; LV.at = Date.now(); clearTimeout(hello); });
    es.onmessage = m=>{ try { const e = JSON.parse(m.data); seq = e.s; onEvent(e); } catch (_){ } };
    es.onerror = ()=>{ LV.ok = false; if (++fails >= 3){ es.close(); clearTimeout(hello); poll(); } };
  } catch (_){ poll(); } }



const SPARSE = 0.1, BASE_G = 0.03;
function levelLive(list, t){ let s = 0; for (const [t0, a] of list){ const d = t - t0; if (d >= 0 && d < 7) s += a*env(d); } return Math.min(1, s); }
const lev = (P, t) => MODE === 'live' ? levelLive(P.lf, t) : level(P.rf, t);
function gain(t){ let s = 0; for (const P of PT.HB) s += lev(P, t); return Math.min(1, SPARSE*D.hubs.length/Math.max(1e-6, s)); }

const glow = (real, k) => { const h = (Date.now() - real)/3.6e6; return real && h < 6 ? k*Math.exp(-h/1.5) : 0; };

function lineVal(L, u, t, r, g, base){
  if (u > r + 1e-6) return 0;
  let sig = 0; const live = MODE === 'live';
  for (const [t0, a, dir] of live ? L.lf : L.rf){ let d = t - t0 - (dir ? 1-u : u)*HOP;
    if (!live) d = (d % LOOP + LOOP) % LOOP; else if (d < 0) continue;
    if (d < 7) sig += a*(0.35*env(d) + (d < HEAD ? 1 - d/HEAD : 0)); }
  let v = base + Math.min(1.2, sig*g)*0.85*L.br;
  if (r < 1){ const x = (r - u)*8; v = Math.max(v, (0.25 + 0.75*L.br)*Math.exp(-x*x)); }
  return v; }
function drawLine(L, t, g){
  const live = MODE === 'live', arr = L.o.arr, ns = (L.v1 - L.v0)/2;

  const age = L.off ? -1 : L.sp ? (live ? t - L.grow : -1) : (L.grow == null || live ? 1e9 : t - L.grow);
  const base = age < 0 ? 0 : (L.grow != null ? BASE_G : 0) + (live ? glow(L.real, 0.035*L.br) : 0);
  let busy = age >= 0 && age < GROWT;
  if (!busy && age >= 0) for (const [t0] of live ? L.lf : L.rf){ let d = t - t0; if (!live) d = (d % LOOP + LOOP) % LOOP;
    if (d >= -HOP && d < 7 + HOP){ busy = true; break; } }
  if (!busy){ if (Math.abs(L.last - base) < 0.002) return; L.last = base; L.o.dirty = true;
    for (let k = L.v0*3, end = L.v1*3; k < end; k += 3){ arr[k] = L.c[0]*base; arr[k+1] = L.c[1]*base; arr[k+2] = L.c[2]*base; } return; }
  L.last = -1; L.o.dirty = true; const r = age >= GROWT ? 1 : age/GROWT;
  for (let s = 0; s < ns; s++){ const k = (L.v0 + 2*s)*3, a = lineVal(L, s/ns, t, r, g, base), b = lineVal(L, (s+1)/ns, t, r, g, base);
    arr[k] = L.c[0]*a; arr[k+1] = L.c[1]*a; arr[k+2] = L.c[2]*a; arr[k+3] = L.c[0]*b; arr[k+4] = L.c[1]*b; arr[k+5] = L.c[2]*b; } }
function draw(ts){ const live = MODE === 'live', t = live ? nowS() : ts, tm = ((t % LOOP) + LOOP) % LOOP, g = gain(live ? t : tm);
  BR.uT.value = live ? t : ts;
  for (const L of GL.lines) drawLine(L, live ? t : tm, g);
  for (const o of GL.groups) if (o.dirty){ o.buf.needsUpdate = true; o.dirty = false; }
  let ch = false;
  for (const P of PT.dyn){ let a;
    if (P.off || (P.sp && !live)) a = -1;
    else if (live) a = P.sp && t < P.born ? -1 : Math.max(levelLive(P.lf, t)*g, glow(P.real, 0.05));
    else a = P.born != null && tm < P.born ? -1 : level(P.rf, tm)*g;
    if (Math.abs(a - PT.act[P.p]) > 0.004){ PT.act[P.p] = a; ch = true; } }
  if (ch) PT.actAttr.needsUpdate = true;
  if (live && LV.ok && Date.now() - LV.at > 45000) LV.ok = false;
  clock(t); renderer.render(scene, cam); }


function busiest(){ const th = EV.filter(e=>e[1] === 1); if (th.length) return th[th.length-1][0]*LOOP + HOP*1.5;
  let best = 0, bt = 0; for (let t = 0; t < LOOP; t += 0.25){ let s = 0; for (const P of PT.HB) s += level(P.rf, t); if (s > best){ best = s; bt = t; } } return bt; }
addEventListener('resize', ()=>{ fit(); if (STILL) draw(T_STILL); });
const T_STILL = STILL ? busiest() : 0;
fit(); home(); connect();
const FPS = /fps/.test(location.search) ? {n:0, t:0} : null;
let last = 0;
function loop(ms){ requestAnimationFrame(loop); if (ms - last < 30) return; last = ms;
  ctl.update(); draw(ms/1000);
  if (FPS){ FPS.n++; if (ms - FPS.t > 1000){ document.getElementById('hint').textContent = Math.round(FPS.n*1000/(ms-FPS.t)) + ' fps'; FPS.n = 0; FPS.t = ms; } } }
STILL ? (draw(T_STILL), document.body.setAttribute('data-ready','1')) : requestAnimationFrame(loop);
</script></body></html>
