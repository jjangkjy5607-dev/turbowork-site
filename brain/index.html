  p.bezierCurveTo(...m(1120,720),...m(1040,700),...m(960,735)); p.bezierCurveTo(...m(880,790),...m(720,800),...m(600,770));
  p.bezierCurveTo(...m(470,740),...m(300,700),...m(230,560));
  c.lineWidth = 1.6*k(); c.strokeStyle = 'rgba(130,160,220,0.30)'; c.setLineDash([6*k(),7*k()]); c.stroke(p); c.setLineDash([]); }

function ctrl(a,b,bend){ const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2, dx=800-mx, dy=420-my, d=Math.hypot(dx,dy)||1, L=Math.hypot(b[0]-a[0],b[1]-a[1])*bend;
  return [mx+dx/d*L, my+dy/d*L]; }
function curve(c,a,b,bend){ const cp = ctrl(a,b,bend); c.moveTo(sx(a[0]),sy(a[1])); c.quadraticCurveTo(sx(cp[0]),sy(cp[1]),sx(b[0]),sy(b[1])); }

const CCR = (()=>{ const ws = D.cc.map(e=>e[2]).sort((x,y)=>x-y), n = ws.length || 1;
  const up = w => { let lo = 0, hi = ws.length; while (lo < hi){ const m = (lo+hi)>>1; ws[m] <= w ? lo = m+1 : hi = m; } return lo; };
  return {o: D.cc.map((e,i)=>i).sort((x,y)=>D.cc[x][2]-D.cc[y][2]), r: D.cc.map(e=>up(e[2])/n)}; })();
const glow = e => !!(e[4] || e[3]);

function paintLayer(){ ldpr = Math.min(dpr, 1.5); MX = Math.round(W*0.25); MY = Math.round(H*0.25);
  LZ = Z; LPX = PX; LPY = PY;
  layer = document.createElement('canvas'); layer.width = (W+2*MX)*ldpr; layer.height = (H+2*MY)*ldpr;
  const c = layer.getContext('2d'); c.setTransform(ldpr,0,0,ldpr,MX*ldpr,MY*ldpr);




  for (const e of D.ic){ if (glow(e)) continue; const it = D.items[e[0]], h = D.hubs[e[1]], col = COL[it[2]];
    c.strokeStyle = `rgba(${col},0.016)`; c.lineWidth = 0.28*k(); c.beginPath(); curve(c,[it[0],it[1]],[h.x,h.y],0.08); c.stroke(); }
  for (const i of CCR.o){ const e = D.cc[i]; if (glow(e)) continue;
    const p = CCR.r[i], a = D.hubs[e[0]], b = D.hubs[e[1]], col = mix(COL[a.g],COL[b.g],.5);
    c.strokeStyle = `rgba(${col},${(0.03 + 0.07*p)*0.8})`; c.lineWidth = 0.3*k(); c.beginPath(); curve(c,[a.x,a.y],[b.x,b.y],0.25); c.stroke(); }
  c.setLineDash([3*k(),5*k()]);
  for (const e of (D.ll || [])){ const a = D.hubs[e[0]], b = D.hubs[e[1]];
    c.strokeStyle = `rgba(196,140,255,${0.15 + 0.5*(e[2]-0.8)/0.2})`; c.lineWidth = 0.9*k(); c.beginPath(); curve(c,[a.x,a.y],[b.x,b.y],0.35); c.stroke(); }
  c.setLineDash([]);
  const act = new Set(D.ic.filter(e=>e[3]).map(e=>e[0]));
  D.items.forEach((it,i)=>{ const col = COL[it[2]], on = act.has(i), r = (on ? 1.9 : 1.3)*Math.max(1,Math.sqrt(Z))*base;
    c.fillStyle = `rgba(${col},${on ? 0.95 : 0.22})`; c.beginPath(); c.arc(sx(it[0]),sy(it[1]),r,0,7); c.fill(); }); }





const GL = (()=>{ const m = new Map();
  const add = (lv, col, w, a, b, bend)=>{ const tier = Math.min(4, Math.floor(lv*5)), key = `${tier}|${col}|${w}`;
    let o = m.get(key); if (!o){ o = {tier, col, w, p: new Path2D()}; m.set(key, o); }
    const cp = ctrl(a,b,bend); o.p.moveTo(a[0],a[1]); o.p.quadraticCurveTo(cp[0],cp[1],b[0],b[1]); };
  D.ic.forEach(e=>{ if (!glow(e)) return; const it = D.items[e[0]], h = D.hubs[e[1]];
    add(e[3] ? 0.45 + 0.55*(h.a||0) : 0.2, mix(COL[it[2]],[255,255,255],.25).join(','), 1, [it[0],it[1]], [h.x,h.y], 0.08); });
  D.cc.forEach((e,i)=>{ if (!glow(e)) return; const p = CCR.r[i], a = D.hubs[e[0]], b = D.hubs[e[1]];
    add(e[3] ? 0.45 + 0.55*Math.max(a.a||0, b.a||0) : 0.1 + 0.3*p, mix(mix(COL[a.g],COL[b.g],.5),[255,255,255],.3).join(','),
        Math.round((0.9 + 2.6*p**3)*2)/2, [a.x,a.y], [b.x,b.y], 0.25); });
  return [...m.values()].sort((x,y)=>x.w-y.w).map((o,j)=>({...o, per: 4.6 - 0.8*o.tier, ph: j*2.399})); })();
function world(){ const kk = base*Z; g.setTransform(dpr*kk,0,0,dpr*kk,dpr*(W/2+(PX-800)*kk),dpr*(H/2+(PY-500)*kk)); }
function glowDraw(t){ world(); g.lineCap = 'round';
  for (const o of GL){ const b = 0.5 + 0.5*Math.sin(t*6.2832/o.per + o.ph);
    g.strokeStyle = `rgba(${o.col},${0.1*b})`; g.lineWidth = o.w*3.2; g.stroke(o.p);
    g.strokeStyle = `rgba(${o.col},${0.22 + 0.73*b})`; g.lineWidth = o.w; g.stroke(o.p); } }


const HB = D.hubs.map(n=>{ const a = n.a || 0; return {n, a, r: a > 0 ? 2 + 2.4*n.s + 2.6*a : 1.6 + 2.2*n.s, hg: null}; });
function hubsDraw(){ world();
  for (const h of HB){ const {n, a, r} = h, col = COL[n.g];
    if (a <= 0){ g.fillStyle = `rgba(${col},0.35)`; g.beginPath(); g.arc(n.x,n.y,r,0,7); g.fill(); }
    else { if (!h.hg){ h.hg = g.createRadialGradient(n.x,n.y,r*0.6,n.x,n.y,r*1.9); h.hg.addColorStop(0,`rgba(${col},${0.35 + 0.25*a})`); h.hg.addColorStop(1,`rgba(${col},0)`); }
      g.fillStyle = h.hg; g.beginPath(); g.arc(n.x,n.y,r*1.9,0,7); g.fill();
      g.fillStyle = `rgba(${col},1)`; g.beginPath(); g.arc(n.x,n.y,r,0,7); g.fill();
      g.fillStyle = `rgba(${mix(col,[255,255,255],.7)},${0.75 + 0.25*a})`; g.beginPath(); g.arc(n.x,n.y,r*0.45,0,7); g.fill(); }
    if (n.learn){ g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = 1.1; g.beginPath(); g.arc(n.x,n.y,6 + 4*n.s,0,7); g.stroke(); } }
  g.setTransform(dpr,0,0,dpr,0,0); }

function labelsDraw(){ if (Z < 3) return;
  const boxes = [], fs = 11; g.font = `500 ${fs}px 'Segoe UI',Arial,sans-serif`; g.textBaseline='middle';
  D.hubs.filter(n=>n.label).sort((a,b)=>b.s-a.s).forEach(n=>{ const x = sx(n.x), y = sy(n.y); if (x < 0 || y < 0 || x > W || y > H) return;
    const w = (n._w || (n._w = g.measureText(n.label).width)) + 6, h = fs + 4, off = (4 + 7*n.s)*k() + 4;
    for (const [dx,dy] of [[off,-h/2],[-off-w,-h/2],[-w/2,off],[-w/2,-off-h]]){ const b = [x+dx,y+dy,w,h];
      if (!boxes.some(o=>b[0]<o[0]+o[2]&&o[0]<b[0]+b[2]&&b[1]<o[1]+o[3]&&o[1]<b[1]+b[3])){ boxes.push(b);
        g.fillStyle='rgba(4,7,14,0.6)'; g.fillRect(b[0],b[1],w,h);
        g.fillStyle=`rgba(${mix(COL[n.g],[255,255,255],.6)},0.9)`; g.fillText(n.label,b[0]+3,b[1]+h/2+1); break; } } }); }

let last = 0;
function frame(ms){ if (!STILL){ requestAnimationFrame(frame); if (ms - last < 30) return; last = ms; }
  const t0 = performance.now(), t = ms/1000; g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  if (!layer) paintLayer();
  const s = Z/LZ, dx = W/2 - W/2*s + (PX-LPX)*base*Z, dy = H/2 - H/2*s + (PY-LPY)*base*Z;
  g.drawImage(layer, dx - MX*s, dy - MY*s, (W+2*MX)*s, (H+2*MY)*s);
  glowDraw(t); hubsDraw(); labelsDraw();
  if (FPS){ FPS.n++; FPS.c = Math.max(FPS.c, performance.now() - t0); FPS.pan = /pan/.test(location.search);
    if (FPS.pan){ PX += 0.6; zoom(1.002); }
    if (ms - FPS.t > 1000){ FPS.v = Math.round(FPS.n*1000/(ms - FPS.t)); FPS.m = FPS.c.toFixed(1); FPS.n = 0; FPS.c = 0; FPS.t = ms; }
    g.fillStyle = '#9fe'; g.font = '14px monospace'; g.fillText(`${FPS.v} fps · max ${FPS.m}ms`, W - 230, H - 20); } }
const FPS = /fps/.test(location.search) ? {n:0, t:0, v:0, c:0, m:0} : null;

let rt = 0; function settle(){ clearTimeout(rt); rt = setTimeout(()=>{ layer = null; }, 160); }
const pts = new Map(); let pinch = 0;
cv.addEventListener('pointerdown', e=>{ pts.set(e.pointerId,[e.clientX,e.clientY]);
  if (!STILL && !INFRAME && !document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); });
addEventListener('pointerup', e=>{ pts.delete(e.pointerId); pinch = 0; });
addEventListener('pointercancel', e=>{ pts.delete(e.pointerId); pinch = 0; });
cv.addEventListener('pointermove', e=>{ if (!pts.has(e.pointerId)) return; const [ox,oy] = pts.get(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]);
  if (pts.size === 1){ PX += (e.clientX-ox)/(base*Z); PY += (e.clientY-oy)/(base*Z); settle(); }
  else { const [a,b] = [...pts.values()], d = Math.hypot(a[0]-b[0],a[1]-b[1]); if (pinch) zoom(d/pinch); pinch = d; } });
cv.addEventListener('wheel', e=>{ e.preventDefault(); zoom(e.deltaY < 0 ? 1.15 : 1/1.15); }, {passive:false});
cv.addEventListener('dblclick', ()=>{ Z = 1; PX = PY = 0; layer = null; });
function zoom(f){ Z = Math.min(8, Math.max(0.6, Z*f)); settle(); }
addEventListener('resize', ()=>{ fit(); if (STILL) frame(2600); }); fit();
STILL ? frame(2600) : requestAnimationFrame(frame);
</script></body></html>
